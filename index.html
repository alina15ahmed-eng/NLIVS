<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLIVS — Ministry of Land, Bangladesh (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';document.head.appendChild(s);"></script>
<style>
:root{
  --green-900:#062f24;
  --green-800:#0a4433;
  --green-700:#0b5e40;
  --green-600:#0f7a4f;
  --green-100:#e5f2ea;
  --red-600:#c62031;
  --red-100:#fbe6e8;
  --gold-600:#a97b1f;
  --gold-100:#f6ecd6;
  --cream:#f6f3ea;
  --paper:#ffffff;
  --ink-900:#141f1a;
  --ink-700:#3b4a43;
  --ink-500:#647167;
  --line:#dcd6c6;
  --line-soft:#e9e4d6;
  --radius:10px;
  --shadow:0 2px 10px rgba(6,47,36,.08);
  --shadow-lg:0 12px 32px rgba(6,47,36,.14);
  --font-display:'Spectral',serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-bn-h:'Noto Serif Bengali',serif;
  --font-bn:'Noto Sans Bengali',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--ink-900);
  font-family:var(--font-body);
  line-height:1.5;
  background-image:
    linear-gradient(var(--cream),var(--cream)),
    repeating-linear-gradient(0deg, rgba(11,94,64,.035) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(90deg, rgba(11,94,64,.035) 0 1px, transparent 1px 26px);
}
body.lang-bn{font-family:var(--font-bn)}
.bn{font-family:var(--font-bn)}
h1,h2,h3,.display{font-family:var(--font-display)}
body.lang-bn h1,body.lang-bn h2,body.lang-bn h3,body.lang-bn .display{font-family:var(--font-bn-h)}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
.container{max-width:1180px;margin:0 auto;padding:0 20px}
.skiplink{position:absolute;left:-999px;top:0;background:#fff;padding:10px;z-index:999}
.skiplink:focus{left:10px}

/* ===== Topbar ===== */
.topbar{background:var(--green-900);color:#eef7f1;font-size:13px}
.topbar .container{display:flex;justify-content:space-between;align-items:center;height:36px;flex-wrap:wrap;gap:6px}
.topbar-left{display:flex;gap:16px;align-items:center}
.topbar a.helpline{color:#ffe9c2;font-weight:600;text-decoration:none}
.topbar-right{display:flex;gap:14px;align-items:center}
.topbar button.link{background:none;border:0;color:#dfeee5;font-size:13px;padding:2px 4px}
.topbar button.link:hover{color:#fff;text-decoration:underline}
.lang-switch{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:6px;padding:2px}
.lang-switch button{background:none;border:0;color:#cfe4d8;padding:3px 9px;border-radius:5px;font-size:12.5px}
.lang-switch button.active{background:#fff;color:var(--green-900);font-weight:700}

/* ===== Header / nav ===== */
.site-header{background:var(--paper);border-bottom:3px solid var(--green-700);position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.header-row{display:flex;align-items:center;gap:14px;padding:12px 0}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;cursor:pointer;background:none;border:0}
.emblem{width:46px;height:46px;border-radius:50%;background:conic-gradient(from 210deg,var(--green-700),var(--green-600) 60%,var(--gold-600) 0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--font-display);font-size:18px;border:2px solid var(--green-900);flex:none}
.brand-text .title-en{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.15;color:var(--green-900)}
.brand-text .title-bn{font-family:var(--font-bn-h);font-size:13px;color:var(--ink-700)}
.header-row .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:7px;border:1px solid var(--green-700);background:var(--green-700);color:#fff;padding:9px 16px;font-size:14px;font-weight:600;transition:.15s}
.btn:hover{background:var(--green-800);border-color:var(--green-800)}
.btn.secondary{background:#fff;color:var(--green-800)}
.btn.secondary:hover{background:var(--green-100)}
.btn.outline{background:transparent;color:var(--green-800)}
.btn.danger{background:var(--red-600);border-color:var(--red-600)}
.btn.danger:hover{background:#a11a28}
.btn.small{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;justify-content:center}
.navbar{border-top:1px solid var(--line-soft);overflow-x:auto}
.navbar .container{display:flex;gap:2px}
.navbar button{background:none;border:0;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--ink-700);white-space:nowrap;border-bottom:3px solid transparent}
.navbar button:hover{color:var(--green-800)}
.navbar button.active{color:var(--green-800);border-bottom-color:var(--gold-600)}

/* ===== Hero ===== */
.hero{background:linear-gradient(180deg,var(--green-900),var(--green-700));color:#fff;padding:46px 0 60px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 22px);pointer-events:none}
.hero-eyebrow{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:20px;font-size:12px;letter-spacing:.04em;margin-bottom:14px}
.hero h1{font-size:clamp(28px,4vw,44px);margin:0 0 10px;line-height:1.15}
.hero p.lead{max-width:640px;color:#dcefe3;font-size:16px;margin:0 0 26px}
.search-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-lg);color:var(--ink-900);max-width:900px}
.search-card h3{margin:0 0 4px;font-size:16px;color:var(--green-900)}
.search-card .hint{font-size:12.5px;color:var(--ink-500);margin-bottom:14px}
.search-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:760px){.search-grid{grid-template-columns:repeat(2,1fr)}}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-700);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:14px;font-family:inherit;background:#fdfcf8}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--green-600);outline-offset:1px}
.search-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px}
.error-text{color:var(--red-600);font-size:12.5px;margin-top:8px}

/* ===== Sections/cards ===== */
.section{padding:44px 0}
.section.tight{padding:26px 0}
.section-head{margin-bottom:22px}
.section-head h2{margin:0 0 6px;font-size:26px;color:var(--green-900)}
.section-head p{margin:0;color:var(--ink-500);font-size:14.5px}
.card{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid.cols-3,.grid.cols-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
.tag.demo{background:var(--gold-100);color:var(--gold-600);border:1px solid #e8d29c}
.tag.green{background:var(--green-100);color:var(--green-800)}
.tag.red{background:var(--red-100);color:var(--red-600)}
.tag.gray{background:#eee;color:#555}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;font-size:14px}
.kv div.k{color:var(--ink-500)}
.kv div.v{font-weight:600}
.divider{height:1px;background:var(--line-soft);margin:16px 0}
.quick-actions{display:flex;flex-wrap:wrap;gap:8px}

/* home feature list */
.feature-card{border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px;background:#fff;cursor:pointer;text-align:left;height:100%}
.feature-card:hover{border-color:var(--green-600);box-shadow:var(--shadow)}
.feature-card .icon{width:38px;height:38px;border-radius:9px;background:var(--green-100);color:var(--green-800);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
.feature-card h4{margin:0 0 5px;font-size:15px}
.feature-card p{margin:0;font-size:13px;color:var(--ink-500)}

/* stat / kpi */
.kpi{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px}
.kpi .num{font-family:var(--font-display);font-size:28px;color:var(--green-900);font-weight:700}
.kpi .label{font-size:12.5px;color:var(--ink-500)}

/* timeline */
.timeline{position:relative;padding-left:26px}
.timeline:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:22px}
.tl-item:before{content:"";position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--green-600);border:3px solid #fff;box-shadow:0 0 0 2px var(--green-600)}
.tl-item.done:before{background:var(--green-600)}
.tl-item.current:before{background:var(--gold-600);box-shadow:0 0 0 2px var(--gold-600)}
.tl-item.pending:before{background:#cbd3ce;box-shadow:0 0 0 2px #cbd3ce}
.tl-item h5{margin:0 0 2px;font-size:14.5px}
.tl-item .meta{font-size:12.5px;color:var(--ink-500)}

/* tables */
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th{text-align:left;background:var(--green-100);color:var(--green-900);padding:9px 10px;font-size:12.5px}
table.data td{padding:9px 10px;border-bottom:1px solid var(--line-soft)}
table.data tr:hover td{background:#faf9f3}

/* forms */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
.step-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.step-pill{font-size:12px;padding:5px 11px;border-radius:16px;background:#eee;color:#666;font-weight:600}
.step-pill.active{background:var(--green-700);color:#fff}
.step-pill.done{background:var(--green-100);color:var(--green-800)}

/* payment */
.method-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.method-card{border:2px solid var(--line-soft);border-radius:var(--radius);padding:14px 10px;text-align:center;background:#fff}
.method-card.selected{border-color:var(--green-600);background:var(--green-100)}
.method-card .logo{font-weight:800;font-size:15px;margin-bottom:4px}

/* chat */
.chat-window{height:420px;overflow-y:auto;border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px;background:#fdfcf8;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.45}
.msg.user{align-self:flex-end;background:var(--green-700);color:#fff;border-bottom-right-radius:2px}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line-soft);border-bottom-left-radius:2px}
.chat-suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 11px}
.chip:hover{border-color:var(--green-600)}

/* toasts */
#toast-root{position:fixed;top:14px;right:14px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink-900);color:#fff;padding:11px 16px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow-lg);max-width:320px;animation:slide .2s ease}
.toast.success{background:var(--green-700)}
.toast.error{background:var(--red-600)}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}

/* footer */
.site-footer{background:var(--green-900);color:#dcefe3;padding:36px 0 18px;margin-top:40px}
.site-footer h5{color:#fff;font-size:14px;margin:0 0 10px}
.site-footer ul{list-style:none;padding:0;margin:0;font-size:13px;display:flex;flex-direction:column;gap:6px}
.site-footer a{text-decoration:none;color:#cfe4d8}
.site-footer a:hover{color:#fff}
.footer-notice{margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.15);font-size:12.5px;color:#b9d4c4}
.helpline-big{font-family:var(--font-display);font-size:22px;color:#ffe9c2;font-weight:700}

/* map */
#leafmap{height:420px;border-radius:var(--radius);border:1px solid var(--line-soft)}
.plot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plot{border:2px dashed #9db9ab;background:#eef6f0;border-radius:8px;padding:14px 8px;text-align:center;font-size:12.5px}
.plot:hover{border-color:var(--green-700);background:var(--green-100)}
.plot.selected{border-style:solid;border-color:var(--green-700);background:var(--green-100)}
.plot .dag{font-weight:700;font-family:var(--font-mono);font-size:14px;color:var(--green-900)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(6,20,15,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:var(--radius);max-width:480px;width:100%;padding:22px;box-shadow:var(--shadow-lg)}

/* login */
.login-wrap{max-width:820px;margin:40px auto}
@media(max-width:700px){.login-wrap .grid.cols-2{grid-template-columns:1fr}.login-wrap .grid.cols-4{grid-template-columns:repeat(2,1fr)}}
.demo-account{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:8px;background:#fdfcf8}

.notif-item{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line-soft)}
.notif-item.unread{background:#f4faf6}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold-600);margin-top:6px;flex:none}

.empty-state{text-align:center;padding:40px 20px;color:var(--ink-500)}
.empty-state .icon{font-size:34px;margin-bottom:10px}

.receipt{border:1px solid var(--line);border-radius:8px;padding:20px;background:#fff;font-family:var(--font-mono);font-size:13px}
.receipt h4{font-family:var(--font-display);margin-top:0}

@media print{
  .no-print{display:none!important}
  body{background:#fff}
}
.helper-note{font-size:12.5px;color:var(--ink-500);background:var(--gold-100);border:1px solid #e8d29c;border-radius:7px;padding:9px 12px}
.disclaimer-box{background:var(--red-100);border:1px solid #eabcc0;border-radius:8px;padding:12px 14px;font-size:13px;color:#7c1620}
label.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-700)}

</style>
</head>

function findProperty(id){ return PROPERTIES.find(p=>p.id===id); }
function fmtMoney(n){ return "৳ " + Number(n).toLocaleString("en-US"); }
function esc(s){ return (s===undefined||s===null) ? "" : String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, type){
  const root = document.getElementById("toast-root");
  const div = document.createElement("div");
  div.className = "toast" + (type ? " " + type : "");
  div.textContent = msg;
  root.appendChild(div);
  setTimeout(()=>{ div.style.opacity="0"; div.style.transition="opacity .3s"; setTimeout(()=>div.remove(),300); }, 3200);
}
function genRef(prefix){
  const n = Math.floor(1000 + Math.random()*8999);
  return prefix + "-2026-" + (100000+Math.floor(Math.random()*899999));
}
function genTxnId(){
  return "LDT-2026-" + (100000+Math.floor(Math.random()*899999));
}
function taxFor(prop){
  // deterministic-looking demo tax based on property id so it's consistent across views
  const seed = prop.id.charCodeAt(prop.id.length-1) + prop.id.length;
  const current = 900 + (seed*137)%2600;
  const dues = prop.taxStatus === "Due" ? 400 + (seed*53)%900 : 0;
  const late = dues > 0 ? Math.round(dues*0.08) : 0;
  return { current, dues, late, total: current+dues+late };
}
function scrollTop(){ window.scrollTo({top:0,behavior:"instant"}); }

}

/* ===================== AI ANSWER ENGINE ===================== */
function isBangla(text){ return /[\u0980-\u09FF]/.test(text); }
function answerAI(text){
  const bangla = isBangla(text);
  const lower = text.toLowerCase();
  let best = null;
  for (const item of AI_KB){
    const list = bangla ? item.kw_bn : item.kw_en;
    for (const kw of list){
      if (bangla ? text.includes(kw) : lower.includes(kw)){ best = item; break; }
    }
    if (best) break;
  }
  if (best) return bangla ? best.bn : best.en;
  return bangla ? (I18N.bn.ai_fallback) : (I18N.en.ai_fallback);
}

POST_RENDER.landmap = function(){
  const el = document.getElementById("leafmap");
  if (!el || typeof L === "undefined") return;
  const map = L.map(el).setView([23.8, 90.4], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 18
  }).addTo(map);
  PROPERTIES.forEach(p=>{
    const marker = L.circleMarker(p.latlng, {
      radius: 9, color: p.id===STATE.highlightPropId ? "#a97b1f" : "#0b5e40",
      weight: 3, fillColor: p.id===STATE.highlightPropId ? "#f6ecd6" : "#e5f2ea", fillOpacity: .9
    }).addTo(map);
    marker.bindPopup(`<strong>${p.mouza}, ${p.upazila}</strong><br>${p.district}<br>Khatian ${p.khatian} · Dag ${p.dag}<br>Owner: ${p.owner}<br><a href="#/property/${p.id}">Open Land Profile →</a>`);
    if (p.id===STATE.highlightPropId) marker.openPopup();
  });
  setTimeout(()=>map.invalidateSize(), 150);
};

/* ===================== DIGITAL DEED PREPARATION ===================== */
VIEWS.deed = function(){
  const step = STATE.deedForm.step;
  const d = STATE.deedForm.data;
  const stepsLabels = ["seller","buyer","land_details","transaction_details","witnesses","review","generate_draft"];
  const pills = `<div class="step-pills">${stepsLabels.map((s,i)=>`<span class="step-pill ${i+1===step?'active':(i+1<step?'done':'')}">${i+1}. ${t(s)}</span>`).join("")}</div>`;
  let body = "";
  const fld = (key,label,val)=>`<div class="field"><label>${label}</label><input data-deed-field="${key}" value="${esc(val||d[key]||'')}"></div>`;

  if (step===1){
    body = `<div class="form-row">${fld('sellerName',t('full_name'))}${fld('sellerNid',t('nid_placeholder'))}</div>
      <div class="form-row">${fld('sellerAddress',t('address'))}${fld('sellerContact',t('contact'))}</div>`;
  } else if (step===2){
    body = `<div class="form-row">${fld('buyerName',t('full_name'))}${fld('buyerNid',t('nid_placeholder'))}</div>
      <div class="form-row">${fld('buyerAddress',t('address'))}${fld('buyerContact',t('contact'))}</div>`;
  } else if (step===3){
    body = `<div class="form-row">${fld('landDistrict',t('district'))}${fld('landUpazila',t('upazila'))}</div>
      <div class="form-row">${fld('landMouza',t('mouza'))}${fld('landKhatian',t('khatian'))}</div>
      <div class="form-row">${fld('landDag',t('dag'))}${fld('landArea',t('land_area'))}</div>
      <div class="form-row">${fld('landClass',t('classification'))}<div></div></div>`;
  } else if (step===4){
    body = `<div class="form-row">${fld('saleValue',t('sale_value'))}${fld('transType',t('transaction_type'))}</div>
      <div class="form-row">${fld('paymentInfo',t('payment_info'))}<div></div></div>`;
  } else if (step===5){
    body = `<div class="form-row">${fld('witness1',t('witness1'))}${fld('witness2',t('witness2'))}</div>`;
  } else if (step===6){
    body = `<div class="kv">
      <div class="k">${t('seller')}</div><div class="v">${d.sellerName||'-'} (${d.sellerNid||'-'})</div>
      <div class="k">${t('buyer')}</div><div class="v">${d.buyerName||'-'} (${d.buyerNid||'-'})</div>
      <div class="k">${t('land_details')}</div><div class="v">${d.landDistrict||''}, ${d.landUpazila||''}, ${d.landMouza||''} — Khatian ${d.landKhatian||''}, Dag ${d.landDag||''}</div>
      <div class="k">${t('transaction_details')}</div><div class="v">৳ ${d.saleValue||'-'} (${d.transType||'-'})</div>
      <div class="k">${t('witnesses')}</div><div class="v">${d.witness1||'-'}, ${d.witness2||'-'}</div>
    </div>
    <button class="btn" style="margin-top:16px" onclick="Actions.deedGenerate()">${t('generate_draft')} →</button>`;
  } else if (step===7){
    body = STATE.deedGenerated ? `
      <div class="disclaimer-box">${t('deed_disclaimer')}</div>
      <div class="receipt" style="margin-top:14px">
        <h4>DEMO LAND DOCUMENT DRAFT</h4>
        <p><strong>${t('seller')}:</strong> ${d.sellerName||'-'} — NID: ${d.sellerNid||'-'}<br>${d.sellerAddress||''} · ${d.sellerContact||''}</p>
        <p><strong>${t('buyer')}:</strong> ${d.buyerName||'-'} — NID: ${d.buyerNid||'-'}<br>${d.buyerAddress||''} · ${d.buyerContact||''}</p>
        <p><strong>${t('land_details')}:</strong> ${d.landDistrict||''}, ${d.landUpazila||''}, ${d.landMouza||''} — Khatian ${d.landKhatian||''}, Dag ${d.landDag||''}, ${d.landArea||''}, ${d.landClass||''}</p>
        <p><strong>${t('transaction_details')}:</strong> ৳ ${d.saleValue||'-'} — ${d.transType||'-'}<br>${d.paymentInfo||''}</p>
        <p><strong>${t('witnesses')}:</strong> ${d.witness1||'-'}, ${d.witness2||'-'}</p>
      </div>
      <div class="quick-actions no-print" style="margin-top:14px">
        <button class="btn secondary" onclick="window.print()">🖨 ${t('print')}</button>
        <button class="btn secondary" onclick="Actions.deedDownload()">⬇ ${t('download')}</button>
        <button class="btn" onclick="Actions.deedRestart()">${STATE.lang==='bn'?'নতুন দলিল':'New draft'}</button>
      </div>` : `<div class="empty-state">${STATE.lang==='bn'?'পর্যালোচনা ধাপ থেকে খসড়া তৈরি করুন।':'Generate the draft from the Review step.'}</div>`;
  }

  const nav_ = step<7 ? `<div class="quick-actions no-print" style="margin-top:18px;justify-content:space-between;display:flex">
      <button class="btn secondary" ${step===1?'disabled':''} onclick="Actions.deedBack()">← ${t('back')}</button>
      ${step<6 ? `<button class="btn" onclick="Actions.deedNext()">${t('next')} →</button>` : ''}
    </div>` : '';

  return `<section class="section"><div class="container">
    ${pageHead(t("deed_title"), t("deed_sub"))}
    <div class="disclaimer-box no-print" style="margin-bottom:16px">${t("deed_disclaimer")}</div>
    <div class="card" style="max-width:760px">
      ${pills}
      ${body}
      ${nav_}
    </div>
  </div></section>`;
};

      <div class="kpi"><div class="num">${props.length}</div><div class="label">${t("total_properties")}</div></div>
      <div class="kpi"><div class="num">${props.length + 340}</div><div class="label">${t("total_records")}</div></div>
      <div class="kpi"><div class="num">${APPLICATIONS.filter(a=>a.stage<5).length}</div><div class="label">${t("pending_mutations")}</div></div>
      <div class="kpi"><div class="num">${COMPLAINTS.filter(c=>c.status===3).length}</div><div class="label">${t("resolved_complaints")}</div></div>
      <div class="kpi"><div class="num">${PROPERTIES.filter(p=>p.dispute).length}</div><div class="label">${t("active_disputes")}</div></div>
      <div class="kpi"><div class="num">${fmtMoney(totalTaxCollected)}</div><div class="label">${t("tax_collected")}</div></div>
      <div class="kpi"><div class="num">${fmtMoney(outstanding)}</div><div class="label">${t("outstanding_tax")}</div></div>
      <div class="kpi"><div class="num">${APPLICATIONS.length}</div><div class="label">${t("applications_processed")}</div></div>
    </div>

    <div class="grid cols-2" style="margin-bottom:16px">
      <div class="card">
        <h3 style="margin-top:0">${t("citizen_login")} <span class="tag demo">DEMO</span></h3>
        <div class="field"><label>${t("mobile_number")}</label><input value="${DEMO_USERS.citizen.mobile}" disabled></div>
        <div class="field" style="margin-top:8px"><label>${t("password")}</label><input type="password" value="${DEMO_USERS.citizen.password}" disabled></div>
        <div class="demo-account">${t("demo_account")}: ${DEMO_USERS.citizen.mobile} / ${DEMO_USERS.citizen.password}</div>
      </div>
      <div class="card">
        <h3 style="margin-top:0">${t("officer_login")} <span class="tag demo">DEMO</span></h3>
        <div class="field"><label>${t("username")}</label><input value="${DEMO_USERS.officer.username}" disabled></div>
        <div class="field" style="margin-top:8px"><label>${t("password")}</label><input type="password" value="${DEMO_USERS.officer.password}" disabled></div>
        <div class="demo-account">${t("demo_account")}: ${DEMO_USERS.officer.username} / ${DEMO_USERS.officer.password}</div>
      </div>
    </div>

    ${monitoringDashboardCard()}

    <div class="grid cols-2" style="margin-top:16px">
      <div class="card"><h4 style="margin-top:0">${t("apps_by_district")}</h4>
        ${Object.entries(byDistrict).map(([d,v])=>barRow(d, v, maxDistrict, "#0b5e40")).join("")}
      </div>
      <div class="card"><h4 style="margin-top:0">${t("mutation_status_chart")}</h4>
        ${mutLabels.map((l,i)=>barRow(l, mutCounts[i]||0, mutTotal, "#a97b1f")).join("")}
      </div>
      <div class="card"><h4 style="margin-top:0">${t("complaint_categories_chart")}</h4>
        ${Object.entries(catCounts).map(([c,v])=>barRow(c, v, catTotal, "#c62031")).join("")}
      </div>
      <div class="card"><h4 style="margin-top:0">${t("tax_trend")}</h4>
        ${["Mar","Apr","May","Jun","Jul","Aug"].map((m,i)=>barRow(m, [38,41,44,47,52,58][i], 58, "#0f7a4f")).join("")}
      </div>
    </div>
  </div></section>`;
};

/* ===================== INIT ===================== */
document.addEventListener("DOMContentLoaded", ()=>{
  const initialHash = location.hash.replace(/^#\//,"");
  if (initialHash){
    const parts = initialHash.split("/");
    STATE.route = parts[0] || "home";
    STATE.params = parts[1] ? { id: decodeURIComponent(parts[1]) } : {};
  }
  render();
});

</script>
</body>
</html>
